# TalentScout Enterprise - Skill Prerequisite, Concept Support, Equivalence & Importance Ontology Configuration
# Defines deterministic prerequisite relationships, concept support, conservative technology equivalences, and skill importance tiers.

config:
  inference_credit_weight: 0.85        # Mid-level prerequisite credit (85%)
  senior_inference_credit_weight: 0.90 # Senior candidate prerequisite credit (90%)
  concept_credit_weight: 0.85          # Higher-level concept inference credit (85%)
  equivalent_credit_weight: 0.80       # Equivalent technology credit (80%)
  preferred_credit_weight: 0.70        # Preferred skill credit (70%)

# Skill Importance Taxonomy
critical_skills:
  - python
  - machine learning
  - deep learning
  - statistics
  - model evaluation
  - tensorflow
  - pytorch
  - java
  - javascript
  - c++
