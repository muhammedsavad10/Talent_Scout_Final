name: TalentScout Backend CI

on:
  push:
    branches: [ main, "feature/*" ]
    paths:
      - 'talent_scout_enterprise/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'talent_scout_enterprise/backend/**'

# Security: Enforce principle of least privilege
permissions:
  contents: read

jobs:
  backend-static-analysis-and-test:
    name: Pytest Suite & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'talent_scout_enterprise/backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r talent_scout_enterprise/backend/requirements.txt
          pip install pytest pytest-asyncio ruff black isort

      - name: Code Formatting & Static Analysis
        run: |
          ruff check talent_scout_enterprise/backend/app talent_scout_enterprise/backend/main.py

      - name: Execute Pytest Backend Test Suite
        run: |
          pytest talent_scout_enterprise/backend/tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Build with Layer Caching
        uses: docker/build-push-action@v5
        with:
          context: ./talent_scout_enterprise/backend
          file: ./talent_scout_enterprise/backend/Dockerfile
          push: false
          tags: talentscout-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
