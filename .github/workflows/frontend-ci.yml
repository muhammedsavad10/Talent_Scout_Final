name: TalentScout Frontend CI

on:
  push:
    branches: [ main, "feature/*" ]
    paths:
      - 'talent_scout_enterprise/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'talent_scout_enterprise/frontend/**'

# Security: Enforce principle of least privilege
permissions:
  contents: read

jobs:
  frontend-compile-and-build:
    name: TypeScript Compilation & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'talent_scout_enterprise/frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: talent_scout_enterprise/frontend
        run: npm install --legacy-peer-deps

      - name: Compile TypeScript & Build Production Asset Bundle
        working-directory: talent_scout_enterprise/frontend
        run: npm run build
